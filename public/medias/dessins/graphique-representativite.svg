<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1200" height="800" fill="#edeae0"/>
  <text x="70" y="78" font-size="34" font-weight="700" fill="#0c0b09">Êtes-vous favorable à une meilleure</text>
  <text x="70" y="120" font-size="34" font-weight="700" fill="#0c0b09">représentativité statistique ?</text>
  <text x="1130" y="120" font-size="22" font-style="italic" fill="#5c574d" text-anchor="end">En % des personnes interrogées, et au-delà</text>
  <line x1="70" y1="152" x2="1130" y2="152" stroke="#0c0b09" stroke-width="3"/>
  <!-- disque : 100 % -->
  <circle cx="400" cy="480" r="240" fill="#0c0b09"/>
  <path d="M400 480 L400 240 A240 240 0 0 1 617 378 Z" fill="#edeae0" stroke="#0c0b09" stroke-width="3"/>
  <path d="M400 480 L617 378 A240 240 0 0 1 640 480 Z" fill="#8f897c" stroke="#0c0b09" stroke-width="3"/>
  <!-- la part qui dépasse : 4 % -->
  <path d="M617 378 A240 240 0 0 1 640 480 L712 480 A312 312 0 0 0 682 347 Z" fill="#c3141b" stroke="#0c0b09" stroke-width="3"/>
  <circle cx="400" cy="480" r="240" fill="none" stroke="#0c0b09" stroke-width="3"/>
  <text x="300" y="560" font-size="64" font-weight="700" fill="#edeae0">61 %</text>
  <text x="440" y="350" font-size="40" font-weight="700" fill="#0c0b09">43 %</text>
  <text x="556" y="452" font-size="26" font-weight="700" fill="#0c0b09">9 %</text>
  <!-- légende -->
  <g font-size="27" fill="#0c0b09">
    <rect x="800" y="290" width="34" height="34" fill="#0c0b09"/><text x="850" y="317">Tout à fait favorables</text>
    <rect x="800" y="350" width="34" height="34" fill="#edeae0" stroke="#0c0b09" stroke-width="3"/><text x="850" y="377">Plutôt favorables</text>
    <rect x="800" y="410" width="34" height="34" fill="#8f897c" stroke="#0c0b09" stroke-width="3"/><text x="850" y="437">Sans opinion, favorables</text>
    <rect x="800" y="470" width="34" height="34" fill="#c3141b" stroke="#0c0b09" stroke-width="3"/><text x="850" y="497">Favorables en surplus</text>
  </g>
  <line x1="716" y1="420" x2="790" y2="486" stroke="#c3141b" stroke-width="2"/>
  <text x="800" y="580" font-size="54" font-weight="700" fill="#c3141b">104 %</text>
  <text x="800" y="616" font-size="22" font-style="italic" fill="#5c574d">Total, marge d’enthousiasme comprise</text>
  <line x1="70" y1="744" x2="1130" y2="744" stroke="#0c0b09" stroke-width="1"/>
  <text x="70" y="776" font-size="20" fill="#5c574d">Source : données corrigées après obtention du résultat. Opposants : −4 % (non représentés, faute de place).</text>
</svg>
